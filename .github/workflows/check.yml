name: Check

# 每次 push / PR 跑一遍离线检查：**只用标准库**，不装依赖、不联网、不调模型。
# 两件事：能不能编译（`_语法检查.py`）、算得对不对（`离线验证_桩.py`，990 项）。
#
# `persona_traits.json` 不随仓库分发，所以桩测试里依赖它的断言会**自动跳过并写明原因**
# （副本实测：通过 990 项 + 跳过 2 组，退出码 0）。
on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: windows-latest
    # 英文区域的 Windows runner 默认用 cp1252，而这两个脚本要打中文 ——
    # 输出被管道捕获时 Python 会用系统区域编码，于是 `UnicodeEncodeError` 崩掉、退出码 1。
    # 脚本里已经各自做了非 tty → UTF-8 的自保；这里再钉一道，覆盖以后新增的步骤。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 语法检查（含 Dockerfile ↔ .dockerignore 一致性、exe 是否过期）
        run: python '_工具链/_语法检查.py'

      - name: 桩测试
        run: python '_工具链/离线验证_桩.py'
